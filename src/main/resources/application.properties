spring.application.name=TransactionProcess
server.port=9091


# ========================================
# Async Thread Pool Configuration
# ========================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=Transaction-Worker-

# ========================================
# Logging Configuration
# ========================================
logging.level.com.example.transactionprocess=DEBUG
logging.level.org.springframework.scheduling=INFO

# ========================================
# Server Configuration
# ========================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s